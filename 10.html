
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌈 10をつくろう！</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: "Meiryo", "Yu Gothic", sans-serif;
  text-align: center;
  color: #574637;
  background: linear-gradient(135deg, #fff2b8, #ffe0ee, #d9f3ff);
}

.container { max-width: 560px; margin: auto; }

h1 {
  margin: 12px 0 6px;
  color: #ff7c78;
  font-size: clamp(28px, 7vw, 40px);
}

.subtitle { font-size: 17px; font-weight: bold; margin-bottom: 16px; }

.panel {
  background: white;
  border: 4px solid white;
  border-radius: 26px;
  padding: 20px 14px;
  margin-bottom: 16px;
  box-shadow: 0 6px 0 #e9cbd2;
}

.hidden { display: none !important; }
h2 { font-size: 24px; margin: 5px 0 18px; }

.mode-button, .submit-button, .next-button, .back-button {
  display: block;
  width: 100%;
  min-height: 60px;
  margin: 12px auto;
  border: 0;
  border-radius: 18px;
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.mode-button { min-height: 76px; font-size: 27px; }
.add-mode { background: #ff9c57; box-shadow: 0 5px #dc783b; }
.sub-mode { background: #64bce8; box-shadow: 0 5px #3997c6; }
.submit-button { background: #ff9957; box-shadow: 0 5px #dc7437; }
.submit-button:disabled { background: #ccc; box-shadow: 0 5px #aaa; cursor: not-allowed; }
.next-button { background: #73c990; box-shadow: 0 5px #4da86b; }
.back-button { background: #9eafe1; box-shadow: 0 5px #7c90c8; }

button:active:not(:disabled) { transform: translateY(3px); }

.progress { font-size: 19px; font-weight: bold; }
.stars { min-height: 32px; margin: 8px; font-size: 24px; }

.instruction {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.6;
  margin: 14px 0;
}

.problem {
  min-height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
  padding: 14px 8px;
  background: #fff8e8;
  border-radius: 20px;
}

.emoji {
  font-size: clamp(28px, 7vw, 42px);
  line-height: 1.4;
}

.answers {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  margin: 16px 0;
}

.answer {
  min-width: 0;
  min-height: 54px;
  border: 3px solid #d9e6f2;
  border-radius: 15px;
  background: #f3f9ff;
  color: #46637c;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.answer.selected { background: #ffe18c; border-color: #ffad33; }
.answer.correct { background: #b8f1bd; border-color: #62c875; }
.answer:disabled { cursor: default; }

.message {
  min-height: 52px;
  margin: 12px 0 4px;
  color: #e77947;
  font-size: 19px;
  font-weight: bold;
}

.clear-title {
  color: #ff8957;
  font-size: 28px;
  font-weight: bold;
  line-height: 1.6;
}

.clear-emoji { font-size: 50px; margin: 14px 0; }

@media (max-width: 360px) {
  body { padding: 7px; }
  .panel { padding: 15px 9px; }
  .answers { gap: 5px; }
  .answer { min-height: 48px; font-size: 22px; }
}
</style>
</head>
<body>
<div class="container">

  <h1>🌈 10をつくろう！</h1>
  <div class="subtitle">かずを かぞえて、10に してみよう！</div>

  <section id="startScreen" class="panel">
    <h2>どちらに ちょうせんする？</h2>
    <button class="mode-button add-mode" onclick="startGame('add')">
      🍎 たしざんで 10！
    </button>
    <button class="mode-button sub-mode" onclick="startGame('sub')">
      🐻 ひきざんで 10！
    </button>
    <p>5もん せいかいしたら クリア！</p>
  </section>

  <section id="gameScreen" class="panel hidden">
    <div class="progress" id="progress">1もんめ / 5もん</div>
    <div class="stars" id="stars">☆ ☆ ☆ ☆ ☆</div>

    <div class="instruction" id="instruction"></div>
    <div class="problem" id="problem"></div>

    <div class="instruction">いくつかな？ かずを えらんでね！</div>
    <div class="answers" id="answers"></div>

    <button id="submitButton" class="submit-button"
      onclick="checkAnswer()" disabled>こたえる！</button>

    <div id="message" class="message" aria-live="polite">
      かずを ひとつ えらんでね！
    </div>

    <button id="nextButton" class="next-button hidden"
      onclick="nextQuestion()">つぎの もんだいへ ➜</button>

    <button class="back-button" onclick="backToStart()">はじめの がめんへ</button>
  </section>

  <section id="clearScreen" class="panel hidden">
    <div class="clear-emoji">🎉 ⭐ 🎉</div>
    <div class="clear-title">5もん せいかい！<br>すごいね！</div>
    <div class="clear-emoji">🏆 🐰 🏆</div>
    <button class="next-button" onclick="startGame(currentMode)">もういちど あそぶ！</button>
    <button class="back-button" onclick="backToStart()">べつの あそびを えらぶ</button>
  </section>
</div>

<script>
const TOTAL = 5;

const pictures = [
  "☺️", "🐻", "🐰", "🐸", "🐱", "🐶",
  "🍎", "🍓", "🍊", "⭐", "🌷", "🐥",
  "🎈", "🍪", "🚗", "🐟", "🦋", "🌼"
];

let currentMode = "add";
let questionNumber = 1;
let correctCount = 0;
let selectedAnswer = null;
let answerValue = 0;
let answered = false;
let startingCount = 0;
let picture = "☺️";

const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const clearScreen = document.getElementById("clearScreen");
const problem = document.getElementById("problem");
const answers = document.getElementById("answers");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");
const nextButton = document.getElementById("nextButton");

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function startGame(mode) {
  currentMode = mode;
  questionNumber = 1;
  correctCount = 0;

  startScreen.classList.add("hidden");
  clearScreen.classList.add("hidden");
  gameScreen.classList.remove("hidden");

  showProblem();
}

function backToStart() {
  gameScreen.classList.add("hidden");
  clearScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
}

// 問題を作る
function makeProblem() {
  picture = pictures[randomInt(0, pictures.length - 1)];

  if (currentMode === "add") {
    // 1～9個の絵に、いくつ足せば10になるか
    startingCount = randomInt(1, 9);
    answerValue = 10 - startingCount;
  } else {
    // 10個の絵から、いくつ取れば10になるか
    // 引く数が1～10になるよう、11～20個から出題
    startingCount = randomInt(11, 20);
    answerValue = startingCount - 10;
  }
}

function showProblem() {
  answered = false;
  selectedAnswer = null;

  document.getElementById("progress").textContent =
    questionNumber + "もんめ / " + TOTAL + "もん";

  document.getElementById("stars").textContent =
    Array.from({ length: TOTAL }, (_, i) =>
      i < correctCount ? "⭐" : "☆"
    ).join(" ");

  makeProblem();

  if (currentMode === "add") {
    document.getElementById("instruction").textContent =
      "あと いくつ たしたら 10かな？";
  } else {
    document.getElementById("instruction").textContent =
      "いくつ とったら 10になるかな？";
  }

  // 絵を表示
  problem.innerHTML = "";

  for (let i = 0; i < startingCount; i++) {
    const item = document.createElement("span");
    item.className = "emoji";
    item.textContent = picture;
    problem.appendChild(item);
  }

  answers.innerHTML = "";

  // 1～10の数字ボタンを作る
  for (let n = 1; n <= 10; n++) {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = n;
    button.type = "button";
    button.setAttribute("aria-label", n + "");

    button.addEventListener("click", () => selectAnswer(n));
    answers.appendChild(button);
  }

  submitButton.disabled = true;
  nextButton.classList.add("hidden");
  message.textContent = "かずを ひとつ えらんでね！";
}

// 数字を選ぶだけでは判定しない
function selectAnswer(n) {
  if (answered) return;

  selectedAnswer = n;

  answers.querySelectorAll(".answer").forEach(button => {
    button.classList.toggle(
      "selected",
      Number(button.textContent) === n
    );
  });

  submitButton.disabled = false;
  message.textContent = n + "を えらんだよ！";
}

// 「こたえる！」を押して正誤判定
function checkAnswer() {
  if (answered || selectedAnswer === null) return;

  if (selectedAnswer === answerValue) {
    answered = true;
    correctCount++;

    message.textContent = "せいかい！ すごいね！ 🎉";

    answers.querySelectorAll(".answer").forEach(button => {
      button.disabled = true;

      if (Number(button.textContent) === answerValue) {
        button.classList.add("correct");
      }
    });

    submitButton.disabled = true;

    document.getElementById("stars").textContent =
      Array.from({ length: TOTAL }, (_, i) =>
        i < correctCount ? "⭐" : "☆"
      ).join(" ");

    if (questionNumber === TOTAL) {
      gameScreen.classList.add("hidden");
      clearScreen.classList.remove("hidden");
    } else {
      nextButton.classList.remove("hidden");
    }
  } else {
    message.textContent = "おしい！ もういちど かんがえてみよう！";

    answers.querySelectorAll(".answer").forEach(button => {
      button.classList.remove("selected");
    });

    selectedAnswer = null;
    submitButton.disabled = true;
  }
}

function nextQuestion() {
  if (!answered || questionNumber >= TOTAL) return;

  questionNumber++;
  showProblem();
}
</script>
</body>
</html>
